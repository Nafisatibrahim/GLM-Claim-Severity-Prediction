<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" role="img" aria-labelledby="t d">
<title id="t">What Makes a Claim Expensive?</title>
<desc id="d">Claim severity modeling with Gamma GLMs and gradient boosting on French motor insurance data (freMTPL2). Illustration of a heavy-tailed claim cost distribution with a spike at a fixed settlement amount.</desc>

<style>
  :root { --bg:#f6f8fa; --edge:#d1d9e0; --ink:#1f2328; --muted:#59636e; --accent:#0969da;
           --accent-soft:#b6d7fb; --done:#1a7f37; --prog:#9a6700; --prog-soft:#fff1c2; --todo:#818b98; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151b23; --edge:#3d444d; --ink:#e6edf3; --muted:#9198a1; --accent:#4493f8;
             --accent-soft:#1f3d63; --done:#3fb950; --prog:#d29922; --prog-soft:#3a2f12; --todo:#768390; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .card { fill:var(--bg); stroke:var(--edge); stroke-width:1; }
  .ink { fill:var(--ink); }
  .muted { fill:var(--muted); }
  .accent { fill:var(--accent); }
  .bar { fill:var(--accent-soft); }
  .spike { fill:var(--accent); }
  .base { stroke:var(--edge); stroke-width:1; }
  .lead { stroke:var(--muted); stroke-width:1; fill:none; }
  .done { fill:var(--done); }
  .prog-ring { fill:var(--prog-soft); stroke:var(--prog); stroke-width:2; }
  .prog-half { fill:var(--prog); }
  .todo { fill:none; stroke:var(--todo); stroke-width:2; }
  .chev { fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .num { fill:var(--accent); }
  .numtxt { fill:#ffffff; }
</style>
