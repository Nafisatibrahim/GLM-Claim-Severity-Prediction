8 Z"/><text class="ink" x="306" y="155" font-size="14">Acquire &amp; join</text><circle class="prog-ring" cx="288" cy="194" r="8"/><path class="prog-half" d="M288 186 A8 8 0 0 1 288 202 Z"/><text class="ink" x="306" y="199" font-size="14">Profiling &amp; quality</text><circle class="todo" cx="288" cy="238" r="8"/><text class="ink" x="306" y="243" font-size="14">EDA</text><path class="chev" d="M498.0 163.0 l6 6 l-6 6"/><rect class="card" x="512.5" y="46.5" width="231" height="245" rx="14"/><circle class="num" cx="542" cy="82" r="14"/><text class="numtxt" x="542" y="87" font-size="14" font-weight="700" text-anchor="middle">3</text><text class="ink" x="566" y="79" font-size="17" font-weight="700">Model</text><text class="muted" x="566" y="98" font-size="12.5">Fit &amp; compare</text><line class="base" x1="530" y1="118" x2="726" y2="118"/><circle class="todo" cx="542" cy="150" r="8"/><text class="ink" x="560" y="155" font-size="14">Train/test split</text><circle class="todo" cx="542" cy="194" r="8"/><text class="ink" x="560" y="199" font-size="14">Features</text><circle class="todo" cx="542" cy="238" r="8"/><text class="ink" x="560" y="243" font-size="14">Baseline · GLM · LightGBM</text><path class="chev" d="M752.0 163.0 l6 6 l-6 6"/><rect class="card" x="766.5" y="46.5" width="231" height="245" rx="14"/><circle class="num" cx="796" cy="82" r="14"/><text class="numtxt" x="796" y="87" font-size="14" font-weight="700" text-anchor="middle">4</text><text class="ink" x="820" y="79" font-size="17" font-weight="700">Learn</text><text class="muted" x="820" y="98" font-size="12.5">Answer the question</text><line class="base" x1="784" y1="118" x2="980" y2="118"/><circle class="todo" cx="796" cy="150" r="8"/><text class="ink" x="814" y="155" font-size="14">Evaluation</text><circle class="todo" cx="796" cy="194" r="8"/><text class="ink" x="814" y="199" font-size="14">Cost drivers</text><circle class="todo" cx="796" cy="238" r="8"/><text class="ink" x="814" y="243" font-size="14">Conclusion</text>
