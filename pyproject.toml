[project]
name = "claim-severity"
version = "0.1.0"
description = "Claim severity prediction on freMTPL2: baseline, Gamma GLM, LightGBM"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
